<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>전화 상담 | IPSIGuide</title>
    <style>
      :root {
        --navy-900: #0f1d3d;
        --blue-500: #2f73ff;
        --gray-50: #f6f8fc;
        --gray-200: #dfe7f5;
        --gray-600: #545d70;
        --white: #ffffff;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        background: linear-gradient(180deg, #f6f9ff 0%, #eef5ff 100%);
        color: var(--navy-900);
      }

      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      .card {
        width: min(760px, 100%);
        background: rgba(255,255,255,0.92);
        border: 1px solid rgba(17, 28, 51, 0.08);
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(17, 28, 51, 0.08);
        padding: 32px 24px;
      }

      .header {
        text-align: center;
        margin-bottom: 28px;
      }

      .header .tag {
        display: inline-block;
        background: rgba(47, 115, 255, 0.08);
        color: var(--blue-500);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 2.8rem);
      }

      .sub {
        margin-top: 10px;
        color: var(--gray-600);
      }

      .contact-box {
        display: grid;
        gap: 18px;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
        color: var(--navy-900);
      }

      input, select, textarea {
        width: 100%;
        border: 1px solid var(--gray-200);
        border-radius: 14px;
        background: var(--white);
        padding: 14px 14px;
        font: inherit;
        color: var(--navy-900);
      }

      textarea {
        min-height: 140px;
        resize: vertical;
      }

      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 12px;
        padding: 14px 24px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--blue-500), var(--navy-900));
        color: var(--white);
      }

      .btn-primary:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .btn-secondary {
        background: var(--gray-50);
        color: var(--navy-900);
        border: 1px solid var(--gray-200);
      }

      .form-status {
        display: none;
        margin: 0;
        padding: 14px 16px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
      }

      .form-status.success {
        display: block;
        border: 1px solid #b7e4c7;
        background: #edf9f0;
        color: #176b35;
      }

      .form-status.error {
        display: block;
        border: 1px solid #f2b8b5;
        background: #fff1f0;
        color: #a61b1b;
      }

      .phone-call {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 10px;
        padding: 16px 20px;
        border-radius: 14px;
        background: #eef5ff;
        border: 1px solid #d9e7ff;
        color: var(--navy-900);
        font-size: 18px;
        font-weight: 800;
        text-decoration: none;
      }

      .note {
        color: var(--gray-600);
        font-size: 13px;
      }

      @media (max-width: 640px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="header">
          <div class="tag">전화 상담</div>
          <h1>전화 상담</h1>
          <div class="sub">학생의 현재 상황을 바탕으로 가장 현실적인 입시 전략을 함께 설계합니다.</div>
        </div>

        <div class="contact-box">
          <a class="phone-call" href="tel:01029283614">010-2928-3614</a>

          <div class="actions">
            <a class="btn btn-secondary" href="index.html">← 메인으로</a>
          </div>

          <div class="note">※ 위 번호로 연락주시면 상담 일정을 안내드립니다.</div>
        </div>
      </div>
    </div>
  </body>
</html>
