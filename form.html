<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>입시 상담 신청 | IPSIGuide</title>
    <style>
      :root {
        --navy-900: #0f1d3d;
        --blue-500: #2f73ff;
        --gray-50: #f6f8fc;
        --gray-200: #dfe7f5;
        --gray-600: #545d70;
        --white: #ffffff;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        background: linear-gradient(180deg, #f6f9ff 0%, #eef5ff 100%);
        color: var(--navy-900);
      }

      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      .card {
        width: min(760px, 100%);
        background: rgba(255,255,255,0.92);
        border: 1px solid rgba(17, 28, 51, 0.08);
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(17, 28, 51, 0.08);
        padding: 32px 24px;
      }

      .header {
        text-align: center;
        margin-bottom: 28px;
      }

      .header .tag {
        display: inline-block;
        background: rgba(47, 115, 255, 0.08);
        color: var(--blue-500);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 2.8rem);
      }

      .sub {
        margin-top: 10px;
        color: var(--gray-600);
      }

      form {
        display: grid;
        gap: 18px;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
        color: var(--navy-900);
      }

      input, select, textarea {
        width: 100%;
        border: 1px solid var(--gray-200);
        border-radius: 14px;
        background: var(--white);
        padding: 14px 14px;
        font: inherit;
        color: var(--navy-900);
      }

      textarea {
        min-height: 140px;
        resize: vertical;
      }

      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 12px;
        padding: 14px 24px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--blue-500), var(--navy-900));
        color: var(--white);
      }

      .btn-secondary {
        background: var(--gray-50);
        color: var(--navy-900);
        border: 1px solid var(--gray-200);
      }

      .phone-call {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 10px;
        padding: 16px 20px;
        border-radius: 14px;
        background: #eef5ff;
        border: 1px solid #d9e7ff;
        color: var(--navy-900);
        font-size: 18px;
        font-weight: 800;
        text-decoration: none;
      }

      .note {
        color: var(--gray-600);
        font-size: 13px;
      }

      @media (max-width: 640px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="header">
          <div class="tag">상담 신청</div>
          <h1>무료 입시 진단 신청</h1>
          <div class="sub">학생의 현재 상황을 바탕으로 가장 현실적인 입시 전략을 함께 설계합니다.</div>
        </div>

        <form action="https://formsubmit.co/sungyeub343@gmail.com" method="post">
          <input type="hidden" name="_subject" value="무료 입시 진단 신청이 접수되었습니다">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_next" value="https://ipsiguide.kr/form.html?v=2&submitted=1">
          <div class="row">
            <label>
              학생 이름
              <input type="text" name="student_name" placeholder="예: 김민준" required />
            </label>
            <label>
              학부모 연락처
              <input type="tel" name="parent_phone" placeholder="예: 010-1234-5678" required />
            </label>
          </div>

          <div class="row">
            <label>
              학년
              <select name="grade">
                <option>중학생</option>
                <option>고1</option>
                <option>고2</option>
                <option>고3</option>
                <option>재수생</option>
                <option>기타</option>
              </select>
            </label>
            <label>
              관심 영역
              <select name="interest">
                <option>수시 전략</option>
                <option>정시 전략</option>
                <option>면접 코칭</option>
                <option>제시문 분석</option>
                <option>인터뷰/발표</option>
                <option>기타</option>
              </select>
            </label>
          </div>

          <label>
            자택주소 정보 (동/호수까지 기재)
            <textarea name="address" placeholder="예: 서울시 강남구 역삼동 123-45 101호" required></textarea>
          </label>

          <label>
            현재 상황
            <textarea name="current_status" placeholder="예: 현재 학업 상황, 목표 대학, 희망 전형, 고민 사항 등을 자세히 적어주세요." required></textarea>
          </label>

          <div class="actions">
            <a class="btn btn-secondary" href="index.html">← 메인으로</a>
            <button class="btn btn-primary" type="submit">상담 신청하기</button>
          </div>

          <a class="phone-call" href="tel:01029283614">010-2928-3614</a>

          <div class="note">※ 신청 후 담당자가 빠르게 연락드려 상담 일정을 안내드립니다.</div>
        </form>
      </div>
    </div>
  </body>
</html>
